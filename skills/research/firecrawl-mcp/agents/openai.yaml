interface:
  display_name: "Firecrawl MCP"
  short_description: "Search, scrape, and extract live web data with Firecrawl"
  default_prompt: "Use $firecrawl-mcp to search, read, or extract web information with the lightest suitable Firecrawl MCP tool and retain source URLs."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "firecrawl"
      description: "Firecrawl MCP server for web search, content extraction, crawling, and browser interaction"
      transport: "streamable_http"
      url: "https://mcp.firecrawl.dev/v2/mcp"
